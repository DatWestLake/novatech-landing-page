  var KEY = "novatech_promo_deadline";
  var DURATION = (Number(K.soGioDemNguoc) || 24) * 60 * 60 * 1000;

  function layHanChot() {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    var t = saved ? parseInt(saved, 10) : NaN;
    if (!t || isNaN(t) || t <= Date.now()) {
      t = Date.now() + DURATION;
      try { localStorage.setItem(KEY, String(t)); } catch (e) {}
    }
    return t;
  }

  var hanChot = layHanChot();
  var elH = document.getElementById("cd-h"), elM = document.getElementById("cd-m"), elS = document.getElementById("cd-s");
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  var d = new Date(hanChot);
  var elDl = document.getElementById("cd-deadline");
  elDl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + " ngày " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
  elDl.setAttribute("datetime", d.toISOString());

  var timerId = null;
  function tick() {
    var left = hanChot - Date.now();
    if (left <= 0) {
      elH.textContent = elM.textContent = elS.textContent = "00";
      if (timerId) { clearInterval(timerId); timerId = null; }
      return;
    }
    var s = Math.floor(left / 1000);
    elH.textContent = pad(Math.floor(s / 3600));
    elM.textContent = pad(Math.floor((s % 3600) / 60));
    elS.textContent = pad(s % 60);
  }
  tick();
  timerId = setInterval(tick, 1000);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (timerId) { clearInterval(timerId); timerId = null; } }
    else if (!timerId) { tick(); timerId = setInterval(tick, 1000); }
  });

  /* ═══════════ POPUP XEM ẢNH LỚN ═══════════ */
  var hop      = document.getElementById("hopanh");
  var hopAnh   = document.getElementById("hopanh-anh");
  var hopTen   = document.getElementById("hopanh-ten");
  var hopDem   = document.getElementById("hopanh-dem");
  var nutTruoc = document.getElementById("hopanh-truoc");
  var nutSau   = document.getElementById("hopanh-sau");
  var nutDong  = document.getElementById("hopanh-dong");

  var dsAnh = [], viTri = 0, nutGoiMo = null;

  function veAnh() {
    hopAnh.src = dsAnh[viTri];
    hopAnh.alt = hopTen.textContent + " – ảnh " + (viTri + 1) + " trên " + dsAnh.length;
    hopDem.textContent = (viTri + 1) + " / " + dsAnh.length;
    var nhieuAnh = dsAnh.length > 1;
    nutTruoc.hidden = !nhieuAnh;
    nutSau.hidden = !nhieuAnh;
    hopDem.hidden = !nhieuAnh;
  }

  function moHop(ds, ten, batDau, nguon) {
    if (!ds || !ds.length) return;
    dsAnh = ds; viTri = batDau > 0 ? batDau : 0; nutGoiMo = nguon || null;
    hopTen.textContent = ten || "";
    veAnh();
    hop.setAttribute("data-mo", "1");
    document.body.style.overflow = "hidden";
    nutDong.focus();
  }

  function dongHop() {
    hop.removeAttribute("data-mo");
    document.body.style.overflow = "";
    hopAnh.removeAttribute("src");
    if (nutGoiMo) { nutGoiMo.focus(); nutGoiMo = null; }
  }

  function chuyenAnh(buoc) {
    if (dsAnh.length < 2) return;
    viTri = (viTri + buoc + dsAnh.length) % dsAnh.length;
    veAnh();
  }

  // Bấm vào ảnh chính trên thẻ sản phẩm -> mở popup đúng ảnh đang hiển thị
  Array.prototype.forEach.call(document.querySelectorAll("[data-phongto]"), function (nut) {
    nut.addEventListener("click", function () {
      var ds;
      try { ds = JSON.parse(nut.getAttribute("data-phongto")); } catch (e) { return; }
      var img = nut.querySelector("img");
      // Nếu ảnh lỗi không tải được thì không mở popup
      if (!img || img.hidden || !img.naturalWidth) return;
      var dangXem = img.getAttribute("src");
      var k = ds.indexOf(dangXem);
      moHop(ds, nut.getAttribute("data-ten"), k < 0 ? 0 : k, nut);
    });
  });

  nutDong.addEventListener("click", dongHop);
  nutTruoc.addEventListener("click", function () { chuyenAnh(-1); });
  nutSau.addEventListener("click", function () { chuyenAnh(1); });

  // Bấm ra nền tối để đóng (không tính khi bấm trúng ảnh hay các nút)
  hop.addEventListener("click", function (e) { if (e.target === hop) dongHop(); });

  document.addEventListener("keydown", function (e) {
    if (hop.getAttribute("data-mo") !== "1") return;
    if (e.key === "Escape") { dongHop(); return; }
    if (e.key === "ArrowLeft")  { chuyenAnh(-1); return; }
    if (e.key === "ArrowRight") { chuyenAnh(1); return; }
    if (e.key === "Tab") {
      // Giữ tiêu điểm quanh quẩn trong popup, không lọt ra trang phía sau
      var co = [nutDong, nutTruoc, nutSau].filter(function (n) { return !n.hidden; });
      var dau = co[0], cuoi = co[co.length - 1];
      if (e.shiftKey && document.activeElement === dau) { e.preventDefault(); cuoi.focus(); }
      else if (!e.shiftKey && document.activeElement === cuoi) { e.preventDefault(); dau.focus(); }
    }
  });

  /* ═══════════ BẤM Ô ẢNH NHỎ ĐỂ ĐỔI ẢNH CHÍNH ═══════════ */
  Array.prototype.forEach.call(document.querySelectorAll("[data-anh]"), function (o) {
    o.addEventListener("click", function () {
      var chinh = document.getElementById(o.getAttribute("data-dich"));
      if (!chinh) return;
      chinh.hidden = false;
      chinh.src = o.getAttribute("data-anh");
      // Đánh dấu ô đang chọn
      var anhEm = o.parentElement.querySelectorAll("[data-anh]");
      Array.prototype.forEach.call(anhEm, function (b) {
        b.classList.remove("border-primary");
        b.classList.add("border-line", "hover:border-primary-light");
        b.removeAttribute("aria-current");
      });
      o.classList.add("border-primary");
      o.classList.remove("border-line", "hover:border-primary-light");
      o.setAttribute("aria-current", "true");
    });
  });

  /* ═══════════ CHỌN NHANH SẢN PHẨM ═══════════ */
  var select = document.getElementById("product");
  Array.prototype.forEach.call(document.querySelectorAll("[data-chon]"), function (btn) {
    btn.addEventListener("click", function () {
      select.value = btn.getAttribute("data-chon");
      xoaLoi(select);
    });
  });

  /* ═══════════ KIỂM TRA FORM ═══════════ */
  var form = document.getElementById("order-form");
  var summary = document.getElementById("error-summary");
  var summaryList = document.getElementById("error-summary-list");
  var successPanel = document.getElementById("success-panel");
  var successDetail = document.getElementById("success-detail");

  var PHONE_RE = /^(0|\+84|84)(3|5|7|8|9)\d{8}$/;

  var LUAT = {
    fullname: function (v) {
      if (!v) return "Vui lòng nhập họ và tên.";
      if (v.length < 2) return "Họ tên quá ngắn, vui lòng nhập đầy đủ.";
      return "";
    },
    phone: function (v) {
      if (!v) return "Vui lòng nhập số điện thoại.";
      if (!PHONE_RE.test(v.replace(/[\s.()-]/g, ""))) return "Số điện thoại không đúng định dạng. Ví dụ hợp lệ: 0912345678.";
      return "";
    },
    product: function (v) { return v ? "" : "Vui lòng chọn sản phẩm bạn quan tâm."; },
    diachi: function (v) {
      if (!v) return F.batBuocDiaChi ? "Vui lòng nhập địa chỉ giao hàng." : "";
      // Đã nhập thì phải đủ chi tiết, tránh kiểu gõ cho có "abc" hay "hn"
      if (v.length < 10) return "Địa chỉ quá ngắn. Ghi rõ số nhà, đường, phường/xã, quận/huyện.";
      return "";
    }
  };

  var O = ["fullname", "phone", "diachi", "product"];
  function nodeLoi(f) { return document.getElementById(f.id + "-error"); }

  function hienLoi(f, msg) {
    f.setAttribute("aria-invalid", "true");
    var n = nodeLoi(f); n.textContent = msg; n.classList.remove("hidden");
  }
  function xoaLoi(f) {
    f.removeAttribute("aria-invalid");
    var n = nodeLoi(f); n.textContent = ""; n.classList.add("hidden");
  }
  function kiemTra(f) {
    var msg = LUAT[f.id](f.value.trim());
    if (msg) hienLoi(f, msg); else xoaLoi(f);
    return msg;
  }

  O.forEach(function (id) {
    var f = document.getElementById(id);
    f.addEventListener("blur", function () { kiemTra(f); });
    f.addEventListener("input", function () {
      if (f.getAttribute("aria-invalid") === "true" && !LUAT[f.id](f.value.trim())) xoaLoi(f);
    });
    f.addEventListener("change", function () {
      if (f.getAttribute("aria-invalid") === "true") kiemTra(f);
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var loi = [];
    O.forEach(function (id) {
      var f = document.getElementById(id);
      var msg = kiemTra(f);
      if (msg) loi.push({ id: id, msg: msg });
    });

    if (loi.length) {
      summaryList.innerHTML = "";
      loi.forEach(function (er) {
        var li = document.createElement("li"), a = document.createElement("a");
        a.href = "#" + er.id; a.textContent = er.msg;
        a.className = "cursor-pointer underline underline-offset-2";
        a.addEventListener("click", function (ev) { ev.preventDefault(); document.getElementById(er.id).focus(); });
        li.appendChild(a); summaryList.appendChild(li);
      });
      summary.hidden = false;
      summary.focus();
      return;
    }

    summary.hidden = true;

    // ► GỬI ĐƠN VỀ HỆ THỐNG CỦA BẠN TẠI ĐÂY, ví dụ:
    //   fetch("/api/orders", { method: "POST", body: new FormData(form) });

    var ten = document.getElementById("fullname").value.trim();
    var sp = select.options[select.selectedIndex].text;
    var dc = document.getElementById("diachi").value.trim();
    form.hidden = true;
    successDetail.textContent = "Cảm ơn " + ten + "! Tư vấn viên sẽ gọi lại trong 5 phút để xác nhận đơn hàng: " + sp + "."
      + (dc ? " Hàng sẽ giao tới: " + dc : "");
    successPanel.hidden = false;
    successPanel.focus();
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  } catch (err) { baoLoiCauHinh(err); }

  /* Thay vì để trang trắng, hiện hẳn thông báo chỉ rõ chỗ sai */
  function baoLoiCauHinh(err) {
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML =
      '<div style="max-width:680px;margin:48px auto;padding:28px;border:2px solid #DC2626;' +
      'border-radius:16px;background:#FEF2F2;font-family:system-ui,sans-serif;color:#0F172A">' +
        '<h1 style="margin:0 0 10px;font-size:22px;color:#B91C1C">Trang chưa hiện được — có lỗi trong khối CAU_HINH</h1>' +
        '<p style="margin:0 0 16px;color:#475569;line-height:1.6">Bạn vừa sửa nội dung ở đầu file <b>index.html</b> và có chỗ sai cú pháp. Sửa xong lưu lại rồi tải lại trang là được.</p>' +
        '<p style="margin:0 0 8px;font-weight:700">Báo lỗi của trình duyệt:</p>' +
        '<pre style="margin:0 0 18px;padding:12px;background:#0F172A;color:#FCA5A5;border-radius:8px;' +
        'overflow-x:auto;font-size:13px;white-space:pre-wrap">' +
        String(err && err.message || err).replace(/[<&]/g, function (c) { return c === "<" ? "&lt;" : "&amp;"; }) +
        '</pre>' +
        '<p style="margin:0 0 8px;font-weight:700">Ba lỗi hay gặp nhất:</p>' +
        '<ol style="margin:0;padding-left:20px;color:#475569;line-height:1.9">' +
          '<li>Giá viết có dấu chấm mà quên nháy kép: <code style="background:#E2E8F0;padding:2px 6px;border-radius:4px">giaMoi: 9.990.000</code> → sửa thành <code style="background:#DCFCE7;padding:2px 6px;border-radius:4px">giaMoi: 9990000</code></li>' +
          '<li>Thiếu dấu phẩy ở cuối một dòng</li>' +
          '<li>Thiếu dấu ngoặc <code style="background:#E2E8F0;padding:2px 6px;border-radius:4px">}</code> hoặc <code style="background:#E2E8F0;padding:2px 6px;border-radius:4px">]</code> khi thêm sản phẩm mới</li>' +
        '</ol>' +
      '</div>';
  }
})();
</script>
</body>
</html>
